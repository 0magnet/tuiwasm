<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tuiwasm — Go terminal libraries in the browser</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #10131a; color: #d3d7cf; }
  body { display: flex; flex-direction: column;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  /* The per-demo links. There are a couple of dozen, so they are folded away
     rather than given a third of the header. */
  /* Windows are positioned against this element, so it has to be the one
     that fills what is left rather than the body. */
  #desktop { flex: 1 1 auto; min-height: 0; position: relative;
             background:
               radial-gradient(circle at 20% 15%, #1b2130 0%, #10131a 55%),
               #10131a; }
  #boot { padding: 14px; color: #6b7280; }
  /* One demo with the page to itself, reached as ?demo=name. It should look
     like the terminal it would run in and nothing else, so the page chrome
     goes and the terminal gets the whole viewport. Set from Go once the demo
     is found; see cmd/desktop. */
  body.solo #desktop { background: #000; }
</style>
</head>
<body>
<div id="desktop"><div id="boot">loading…</div></div>
<script src="jsfs.js"></script>
<script src="vnet.js"></script>
<script src="wasm_exec.js"></script>
<script>
  // The .wasm is fetched compressed: GitHub Pages serves application/wasm
  // with content-encoding gzip on its own, so there is nothing to configure.
  const go = new Go();
  const boot = document.getElementById("boot");
  WebAssembly.instantiateStreaming(fetch("desktop.wasm"), go.importObject)
    .then((r) => { if (boot) boot.remove(); go.run(r.instance); })
    .catch((err) => {
      if (boot) boot.textContent = "failed to start: " + err;
      console.error(err);
    });
</script>
</body>
</html>
